databaseChangeLog:

  - changeSet:
      id: 001-user-deleted-outbox-table
      author: victoria

      changes:

        - createTable:
            schemaName: outbox
            tableName: user_deleted_outbox

            columns:

              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: locked_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE